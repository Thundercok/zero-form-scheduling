[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-form-scheduling"
version = "0.1.0"
description = "Multi-mode group timetable composition, conflict detection, and RFC 5545 iCalendar sync — foundation for Zero-Form Group Scheduling."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Huynh Nhat Huy"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zfs = "zero_form_scheduling.cli:main"

[tool.setuptools.packages.find]
include = ["zero_form_scheduling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
